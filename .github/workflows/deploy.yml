name: CloudDeploy CD

on:
  workflow_run:
    workflows:
      - CloudDeploy CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clouddeploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified image to EC2
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      IMAGE_TAG: clouddeploy:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      IMAGE_ARCHIVE: clouddeploy-image.tar.gz
      SSH_KEY_PATH: /tmp/clouddeploy-deploy-key
      KNOWN_HOSTS_PATH: /tmp/clouddeploy-known-hosts
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_PATH"
          chmod 600 "$KNOWN_HOSTS_PATH"

          ssh-keygen -F "$EC2_HOST" -f "$KNOWN_HOSTS_PATH" >/dev/null

      - name: Build the verified Docker image
        run: docker build --tag "$IMAGE_TAG" .

      - name: Export the Docker image
        run: docker save "$IMAGE_TAG" | gzip --stdout > "$IMAGE_ARCHIVE"

      - name: Transfer the image to EC2
        run: |
          scp \
            -i "$SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
            "$IMAGE_ARCHIVE" \
            "$EC2_USER@$EC2_HOST:/tmp/clouddeploy-$DEPLOY_SHA.tar.gz"

      - name: Replace the website container
        run: |
          ssh \
            -i "$SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          deploy_sha="$1"
          archive="/tmp/clouddeploy-${deploy_sha}.tar.gz"
          image="clouddeploy:${deploy_sha}"
          container_name="clouddeploy"
          candidate_name="clouddeploy-candidate"
          rollback_image="clouddeploy:rollback"
          had_previous=false

          cleanup() {
            rm -f "$archive"
            docker rm --force "$candidate_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_for_http_200() {
            local url="$1"
            local status_code

            for attempt in $(seq 1 10); do
              status_code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [ "$status_code" = "200" ]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          rollback() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            if [ "$had_previous" = true ]; then
              docker run \
                --detach \
                --name "$container_name" \
                --restart unless-stopped \
                --publish 80:80 \
                "$rollback_image"
            fi
          }

          docker load --input "$archive"

          docker rm --force "$candidate_name" >/dev/null 2>&1 || true
          docker run \
            --detach \
            --name "$candidate_name" \
            --publish 127.0.0.1:18080:80 \
            "$image"

          wait_for_http_200 http://127.0.0.1:18080/
          docker rm --force "$candidate_name" >/dev/null

          if docker container inspect "$container_name" >/dev/null 2>&1; then
            previous_image_id="$(docker inspect --format '{{.Image}}' "$container_name")"
            docker image tag "$previous_image_id" "$rollback_image"
            had_previous=true
            docker rm --force "$container_name" >/dev/null
          fi

          if ! docker run \
            --detach \
            --name "$container_name" \
            --restart unless-stopped \
            --publish 80:80 \
            "$image"; then
            rollback
            exit 1
          fi

          if ! wait_for_http_200 http://127.0.0.1/; then
            rollback
            exit 1
          fi

          echo "CloudDeploy ${deploy_sha} is serving HTTP 200."
          REMOTE_SCRIPT

      - name: Clean up deployment files
        if: always()
        run: |
          if [ -s "$SSH_KEY_PATH" ] && [ -s "$KNOWN_HOSTS_PATH" ] && [ -n "$EC2_HOST" ] && [ -n "$EC2_USER" ]; then
            ssh \
              -i "$SSH_KEY_PATH" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
              "$EC2_USER@$EC2_HOST" \
              "rm -f '/tmp/clouddeploy-$DEPLOY_SHA.tar.gz'" || true
          fi

          rm -f "$IMAGE_ARCHIVE" "$SSH_KEY_PATH" "$KNOWN_HOSTS_PATH"
